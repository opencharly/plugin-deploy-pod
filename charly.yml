# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. This file declares no entities of its own - it only tells charly where to look.
discover:
    - path: candy
      recursive: true

# ---------------------------------------------------------------------------
# THE R10 BED for plugin-deploy-pod's IMAGE-PRESENT path (opencharly/opencharly#481 leg 17).
#
# WHY THIS BED EXISTS: this lane migrates the engine the pod deploy hands to `ensureImagePresent`
# — the function that guarantees a pod's image is in podman's store before the config is written.
# It used to read the IMAGE BUILDER's engine (`rt.BuildEngine`); the builder is BuildKit now, which
# is not a container engine, so what that path always needed was `engine.run`. What a user observes
# is `charly config` on a pod deploy resolving and ensuring its image, so that is the gate.
#
# THE COMPOSITION IS THE POINT: `deploy:pod` is an OUT-OF-TREE provider, so the bed's project must
# compose THIS repo's candy (`plugin-deploy-pod`) for the host to build the plugin from this
# worktree's own source — the gate then exercises THIS code, not a released plugin. The idiom is
# plugin-bpf's `check-bpf-local-app` (an out-of-tree plugin gating itself).
#
# THE ENSURE PATH MUST FIRE, which is why the entity's image is a SMALL PUBLIC ref that is NOT in
# the local store: the short-circuit at the top of `ensureImagePresent` would otherwise return
# before the migrated code runs. The step asserts the command's OWN exit status from a retained log,
# never a pipeline's.
#
# `${CHARLY_BIN}` is BRACED and named in the step's own evidence, so a run against a stale install
# is impossible rather than merely unlikely.
# ---------------------------------------------------------------------------

# The entity the gate configures: a pod deploy whose image is absent locally, so the migrated
# ensure path runs. (A pod's image is normally a charly candybox; what this gate proves is the
# ENSURE leg — resolution, the run-engine transfer check and the build:ensure peer dispatch — not
# the guest's own contents.)
# ARM 1's entity: the ref is ABSENT BY CONSTRUCTION (a tag that does not exist), so the ensure leg
# always fires and the arm is idempotent — unlike a real public ref, which the first run would pull
# into the store and every later run would then short-circuit past.
pod-ensure-gate-absent:
    pod:
        image: docker.io/library/busybox:zzz-ensure-gate-does-not-exist
        disposable: true

# ARM 2's entity: an image PROVISIONED from a PUBLIC registry by a pinned, immutable tag, carrying
# charly's embedded metadata, so the whole `charly config` path completes and the short-circuit
# branch is what runs. Provisioning is what makes this arm hermetic: nothing here depends on an
# image some other repo happened to leave in a local store.
pod-ensure-gate-present:
    pod:
        image: ghcr.io/opencharly/check-firecracker-app:2026.287.1522
        disposable: true

pod-ensure-gate-template:
    local:
        description: |-
            Minimal kind:local template for the pod image-ensure bed: composes THIS repo's
            out-of-tree `plugin-deploy-pod` candy so the host builds the plugin from this worktree,
            and carries no plan — the checks live on the deploy that composes it.
        candy:
            - plugin-deploy-pod

check-pod-ensure-gate:
    local:
        from: pod-ensure-gate-template
        host: local
        disposable: true
        lifecycle: test
        plan:
            - check: the IMAGE-ENSURE dispatch runs on the ACTIVE binary — for a pod whose image is
                  absent, the migrated leg reaches the build:ensure peer (the request the contract
                  changed) and the path's verdict is its own named not-local error, never a decode
                  or contract failure
              id: pe-ensure-dispatch-runs
              context: [runtime]
              timeout: 900s
              exit_status: 0
              stdout:
                contains: PE-DISPATCH-OK
              command:
                in_container: false
                command: |
                    set -eu
                    LOG="$PWD/.check/pod-ensure-dispatch.log"; mkdir -p "$(dirname "$LOG")"
                    arms() {
                    echo "== the binary under test is ${CHARLY_BIN} ($(${CHARLY_BIN} version 2>/dev/null | tail -1))"
                    ${CHARLY_BIN} config pod-ensure-gate-absent > "$LOG.raw" 2>&1; rc=$?
                    grep -Ev '^plugin ' "$LOG.raw" | tail -8 || true
                    echo "== charly config rc=$rc"
                    echo "== PE-DISPATCH-OK"
                    }
                    if arms >"$LOG" 2>&1; then :; else rc=$?; cat "$LOG"; exit $rc; fi
                    # THE MIGRATED LEG RAN: the ensure leg names the image and starts the fetch. This is
                    # the code the change touches — the dispatch with the contracted-away field gone.
                    grep -q 'ensure-image: pulling ' "$LOG" || { echo "the ensure leg never fired, so nothing this change migrates was exercised"; cat "$LOG"; exit 1; }
                    grep -q 'zzz-ensure-gate-does-not-exist' "$LOG" || { echo "the ensure leg named a different image"; cat "$LOG"; exit 1; }
                    # AND IT FAILED AS THE CONTRACT SAYS, not as a decode/contract error: a retired field
                    # reaching the peer would surface here as an unknown-field or unmarshal failure.
                    if grep -qiE 'unknown field|BuildEngine|cannot unmarshal|invalid character' "$LOG"; then
                      echo "the peer rejected the REQUEST (a contract failure), not the image"; cat "$LOG"; exit 1
                    fi
                    grep -q 'charly config rc=' "$LOG" || { echo "the command's own exit status is not in the evidence"; cat "$LOG"; exit 1; }
                    cat "$LOG"
                    echo PE-DISPATCH-OK
            - check: the pod config path completes on the ACTIVE binary for a pod whose image IS present
                  and carries charly's metadata — the same path, the short-circuit branch, end to end
              id: pe-config-path-completes
              context: [runtime]
              timeout: 900s
              exit_status: 0
              stdout:
                contains: PE-CONFIG-OK
              command:
                in_container: false
                command: |
                    set -eu
                    LOG="$PWD/.check/pod-config-present.log"; mkdir -p "$(dirname "$LOG")"
                    arms() {
                    echo "== the binary under test is ${CHARLY_BIN} ($(${CHARLY_BIN} version 2>/dev/null | tail -1))"
                    # PROVISION FIRST — the arm is hermetic only because the image comes from a PUBLIC
                    # registry by a pinned tag, and the provision is idempotent (a present image is a
                    # no-op). A clean machine pulls it here; nothing is assumed to be lying around.
                    ${CHARLY_BIN} box pull ghcr.io/opencharly/check-firecracker-app:2026.287.1522 2>&1 | tail -2
                    ${CHARLY_BIN} config pod-ensure-gate-present > "$LOG.raw" 2>&1; rc=$?
                    grep -Ev '^plugin ' "$LOG.raw" | tail -8 || true
                    echo "== charly config rc=$rc"
                    [ "$rc" = "0" ] || { echo "the pod config path failed ($rc) on a present, metadata-carrying image"; tail -20 "$LOG.raw"; exit 1; }
                    echo "== PE-CONFIG-OK"
                    }
                    if arms >"$LOG" 2>&1; then :; else rc=$?; cat "$LOG"; exit $rc; fi
                    grep -q 'check-firecracker-app:2026.287.1522 present' "$LOG" || { echo "the provision leg did not report the published image present — the arm's input is not established"; cat "$LOG"; exit 1; }
                    grep -q 'charly config rc=0' "$LOG" || { echo "the command's own exit status is not in the evidence"; cat "$LOG"; exit 1; }
                    cat "$LOG"
                    echo PE-CONFIG-OK


# ---------------------------------------------------------------------------
# THE R10 BED for the missing-required-secret REPORT (opencharly/plugin-deploy-pod#61).
#
# WHY THIS BED EXISTS: the change under test is the text `charly config` prints when a required
# credential-backed secret does not resolve. Two failures used to render as one ("Store them in the
# credential backend"): a store that could not be READ (a locked or unreachable keyring) and a
# readable store whose coordinate is empty. The bed drives the REAL `charly config` on the ACTIVE
# binary against an image whose labels declare a required credential at an explicit coordinate
# (`charly/api-key/qdrant`), forcing each class through the environment instead of a stub — so both
# changed branches EXECUTE, which is the R10 claim the unit tests alone cannot make.
#
# ARM A — store unreadable: a keyring backend pointed at a session bus that does not exist, so the
# probe fails and the resolver classifies the lookup `unavailable`.
# ARM B — store readable, coordinate empty: the config backend over an empty XDG config dir, so the
# store answers "not stored" (`default`) rather than "cannot be read".
#
# THE SUBJECT'S IMAGE MUST BE PRESENT LOCALLY, and that is stated rather than hidden: the org's
# ghcr packages refuse ANONYMOUS pulls (measured 2026-11-16 — `ghcr.io/token?scope=repository:
# opencharly/<any>:pull` answers HTTP 403, which is also why the sibling `check-pod-ensure-gate`
# arm that PULLS `check-firecracker-app` cannot run on a clean host). This bed therefore asserts the
# MESSAGE, not image provisioning, and needs an image whose labels carry `secret_require` with a
# `key:` override — `ghcr.io/opencharly/owui-qdrant-proof` is that image where the umbrella's own bed
# has already produced it. Making the subject pullable is opencharly/plugin-deploy-pod#65.
pod-secret-diag:
    pod:
        image: ghcr.io/opencharly/owui-qdrant-proof:2026.319.0931
        disposable: true

pod-secret-diag-template:
    local:
        description: |-
            Minimal kind:local template for the secret-diagnostic bed: composes THIS repo's
            out-of-tree `plugin-deploy-pod` candy so the host builds the plugin from this worktree,
            and carries no plan — the checks live on the deploy that composes it.
        candy:
            - plugin-deploy-pod

check-pod-secret-diagnostic:
    local:
        from: pod-secret-diag-template
        host: local
        disposable: true
        lifecycle: test
        plan:
            - check: the missing-required-secret report names the queried coordinate, says when the
                  store could not be READ (no store-it advice), and keeps the store-it advice only for
                  a readable store whose coordinate is empty
              id: pd-secret-unreadable-vs-absent
              context: [runtime]
              timeout: 900s
              exit_status: 0
              stdout:
                contains: PD-SECRET-DIAG-OK
              command:
                in_container: false
                command: |
                    set -eu
                    LOG="$PWD/.check/pod-secret-diagnostic.log"; mkdir -p "$(dirname "$LOG")"
                    rm -f "$LOG.a" "$LOG.b"; rm -rf "$PWD/.check/pod-secret-diag-empty-xdg"
                    mkdir -p "$PWD/.check/pod-secret-diag-empty-xdg"
                    arms() {
                    echo "== the binary under test is ${CHARLY_BIN} ($(${CHARLY_BIN} version 2>/dev/null | tail -1))"
                    echo "== ARM A — store UNREADABLE (keyring backend, session bus absent)"
                    if DBUS_SESSION_BUS_ADDRESS="unix:path=$PWD/.check/pod-secret-diag-absent-bus" \
                       CHARLY_SECRET_BACKEND=keyring ${CHARLY_BIN} config pod-secret-diag -e WEBUI_ADMIN_EMAIL=bed@example.com >"$LOG.a" 2>&1; then
                      echo "arm A rc=0 — the config did NOT stop on a required unresolvable secret"; fi
                    echo "arm A rc=$?"
                    grep -Ev '^plugin ' "$LOG.a" | tail -26 || true
                    echo "== ARM B — store READABLE, coordinate EMPTY (config backend, empty XDG)"
                    if XDG_CONFIG_HOME="$PWD/.check/pod-secret-diag-empty-xdg" CHARLY_SECRET_BACKEND=config \
                       ${CHARLY_BIN} config pod-secret-diag -e WEBUI_ADMIN_EMAIL=bed@example.com >"$LOG.b" 2>&1; then
                      echo "arm B rc=0 — the config did NOT stop on a required unresolvable secret"; fi
                    echo "arm B rc=$?"
                    grep -Ev '^plugin ' "$LOG.b" | tail -26 || true
                    }
                    if arms >"$LOG" 2>&1; then :; else rc=$?; cat "$LOG"; exit $rc; fi
                    # ARM A: the unreadable store is NAMED, its source rendered, the queried coordinate
                    # named, and no store-it advice — the regression this change closes.
                    grep -q 'could not READ the credential store' "$LOG.a" || { echo "arm A: the unreadable store is not named"; cat "$LOG.a"; exit 1; }
                    grep -q 'source: unavailable' "$LOG.a" || { echo "arm A: the resolver source is not rendered"; cat "$LOG.a"; exit 1; }
                    grep -q 'charly/api-key/qdrant' "$LOG.a" || { echo "arm A: the queried coordinate is not named"; cat "$LOG.a"; exit 1; }
                    grep -q 'charly secrets get charly/api-key qdrant' "$LOG.a" || { echo "arm A: no way for the operator to confirm the value"; cat "$LOG.a"; exit 1; }
                    if grep -q 'Store them in the credential backend' "$LOG.a"; then
                      echo "arm A: an unreadable store still advises a store operation"; cat "$LOG.a"; exit 1; fi
                    # ARM B: a readable store with an empty coordinate keeps the advice AND names the
                    # coordinate, and must NOT be reported as unreadable.
                    grep -q 'Store them in the credential backend' "$LOG.b" || { echo "arm B: the store-it advice vanished for a readable store"; cat "$LOG.b"; exit 1; }
                    grep -q 'charly/api-key/qdrant' "$LOG.b" || { echo "arm B: the queried coordinate is not named"; cat "$LOG.b"; exit 1; }
                    if grep -q 'could not READ the credential store' "$LOG.b"; then
                      echo "arm B: a readable store was reported unreadable"; cat "$LOG.b"; exit 1; fi
                    cat "$LOG"
                    echo PD-SECRET-DIAG-OK
